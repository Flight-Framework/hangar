name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    container: swift:6.3.3
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.3.3"]

    # A dedicated database per job. The integration suite drops and recreates
    # its fixture tables, so it needs a server of its own — see CONTRIBUTING.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hangar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Every dependency is public now, so this is a rate-limit courtesy
      # rather than a requirement — a fork with no secret resolves fine.
      - name: Configure git
        run: |
          if [ -n "${{ secrets.SWIFTFLIGHT_CI_TOKEN }}" ]; then
            git config --global url."https://x-access-token:${{ secrets.SWIFTFLIGHT_CI_TOKEN }}@github.com/".insteadOf "https://github.com/"
          fi
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      # Fails rather than silently skipping if the database is unreachable.
      # A green run that skipped every integration test proves almost nothing,
      # and this suite's whole value is what it proves against real Postgres.
      - name: Verify the integration gate is armed
        env:
          HANGAR_TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/hangar_test
        run: |
          if [ -z "$HANGAR_TEST_DATABASE_URL" ]; then
            echo "::error::integration tests would skip — the database URL is unset"
            exit 1
          fi

      - name: Test
        env:
          HANGAR_TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/hangar_test
        run: ./CI/run-tests.sh

  macos:
    name: Build on macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.3"

      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors

      # macOS runners have no Docker and GitHub service containers are
      # Linux-only, so the integration suites cannot run here — this job
      # exists to prove the `platforms: [.macOS(.v15)]` claim in
      # Package.swift actually compiles and that the unit suites pass.
      # Linux is where the integration coverage lives, gated so it cannot
      # skip silently.
      - name: Test (unit suites — no database on a macOS runner)
        run: ./CI/run-tests.sh

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    container: swift:6.3.3
    steps:
      # Every dependency is public now, so this is a rate-limit courtesy
      # rather than a requirement — a fork with no secret resolves fine.
      - name: Configure git
        run: |
          if [ -n "${{ secrets.SWIFTFLIGHT_CI_TOKEN }}" ]; then
            git config --global url."https://x-access-token:${{ secrets.SWIFTFLIGHT_CI_TOKEN }}@github.com/".insteadOf "https://github.com/"
          fi
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4

      - name: Generate documentation
        env:
          HANGAR_BUILD_DOCS: "1"
        run: |
          swift package --allow-writing-to-directory ./docs \
            generate-documentation --target Hangar \
            --warnings-as-errors --output-path ./docs
